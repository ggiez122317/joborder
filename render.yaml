# Render blueprint for the LGU Trento PDS app.
# Usage: push this file, then in Render Dashboard -> New -> Blueprint,
# point at this repo. Fill in every `sync: false` value when prompted.
services:
  - type: web
    name: pds-laravel
    runtime: docker
    plan: free # Free tier: sleeps when idle, ephemeral disk (uploads live on R2, sessions in cookies)
    autoDeploy: true
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    envVars:
      # --- App ---
      - key: APP_NAME
        value: LGU TRENTO PDS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false # e.g. https://pds-lgu-trento.onrender.com (or leave empty to auto-derive)
      - key: APP_KEY
        sync: false # generate: php artisan key:generate --show (keep secret, never commit)
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: MIGRATE_ON_DEPLOY
        value: true # set false once the database is stable if you prefer manual migrates

      # --- Database (external MySQL — fill in when ready) ---
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # --- Sessions / cache (no extra services needed) ---
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_LIFETIME
        value: 120
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # --- Uploads: local disk by default; set these for Cloudflare R2 ---
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false # e.g. https://<account-id>.r2.cloudflarestorage.com
      - key: AWS_URL
        sync: false # bucket public URL, e.g. https://<bucket>.<account-id>.r2.dev
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: false

      # --- Mail (fill in; user accounts need working mail for 2FA codes) ---
      - key: MAIL_MAILER
        value: log # change to smtp once credentials are set
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: noreply@example.com
      - key: MAIL_FROM_NAME
        value: LGU TRENTO PDS

      # --- reCAPTCHA (leave empty to keep login captcha-free) ---
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RECAPTCHA_ENABLED
        value: false

      - key: JWT_SECRET
        sync: false
